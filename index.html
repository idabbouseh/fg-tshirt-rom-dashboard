<style>
:root{--navy:#12232F;--gold:#F0AB00;--ink:#0B1220;--line:#D7DFE7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--navy);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#E8EEF4}
.box{width:min(420px,92vw);background:#fff;color:var(--ink);border-radius:14px;padding:30px 28px;

.sub{margin:0 0 20px;font-size:.78rem;color:#5B6B7F}

input{width:100%;padding:11px 12px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:#F7F9FB}
input:focus{outline:2px solid var(--gold);outline-offset:1px;background:#fff}
button{width:100%;margin-top:14px;padding:11px;font-size:.92rem;font-weight:700;color:var(--navy);
  background:var(--gold);border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{margin-top:12px;font-size:.8rem;color:#A8331A;min-height:1.2em}
.foot{margin-top:18px;font-size:.7rem;color:#7B8A9B;border-top:1px solid var(--line);padding-top:12px}
